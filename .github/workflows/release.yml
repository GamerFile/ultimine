name: Auto Release MCADDON

# Trigger the workflow only when changelog.md is modified on the main branch
on:
  push:
    branches:
      - main
    paths:
      - 'changelog.md'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Required permission to create a release in your repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from changelog
        id: get_version
        run: |
          # Uses regex to find the first standard version number (e.g., 1.0.0 or 1.2.4)
          # -m 1 ensures it only grabs the very first match it finds at the top of the file
          VERSION=$(grep -m 1 -oE '[0-9]+\.[0-9]+\.[0-9]+' changelog.md)
          
          if [ -z "$VERSION" ]; then
            echo "Error: No version number found in changelog.md"
            exit 1
          fi
          
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip folders and name .mcaddon
        id: build
        env:
          # Automatically grabs your repository's name
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Format: repo-name-1.0.0.mcaddon
          FILE_NAME="Ultimine_${VERSION}.mcaddon"
          
          # The zip command can create the .mcaddon extension directly
          zip -r "$FILE_NAME" BP RP
          
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: ${{ github.event.repository.name }} v${{ steps.get_version.outputs.version }}
          files: ${{ steps.build.outputs.file_name }}
          # Optional: This pulls the text from your changelog into the release notes!
          body_path: changelog.md
