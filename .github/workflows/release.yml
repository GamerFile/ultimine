name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from changelog (with fallback to origin/main)
        id: version
        run: |
          # Prefer changelog.md from the checked-out commit (tag). If missing, fall back to origin/main.
          if [ -f changelog.md ]; then
            echo "Found changelog.md in checked out commit"
            cp changelog.md release_notes.md
          else
            echo "changelog.md not found in checked out commit — attempting to fetch from origin/main"
            git fetch origin main --depth=1 || git fetch origin main
            if git show origin/main:changelog.md > release_notes.md 2>/dev/null; then
              echo "Using changelog.md from origin/main"
            else
              echo "changelog.md not found in origin/main either" >&2
              exit 1
            fi
          fi

          VERSION=$(grep -m1 -oP '\d+\.\d+\.\d+' release_notes.md || true)
          if [ -z "$VERSION" ]; then
            echo "No version found in changelog.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .mcaddon and zip BP/RP
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release_tmp
          cp -r BP RP release_tmp/ || true
          cd release_tmp || exit 1
          zip -r "../ultimine-${VERSION}.mcaddon" BP RP || true
          cd ..
          zip -r "ultimine-${VERSION}-BP.zip" BP || true
          zip -r "ultimine-${VERSION}-RP.zip" RP || true
          ls -l || true

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          release_name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload .mcaddon asset
        if: steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "ultimine-${{ steps.version.outputs.version }}.mcaddon"
          asset_name: "ultimine-${{ steps.version.outputs.version }}.mcaddon"
          asset_content_type: application/zip

      - name: Upload BP zip
        if: steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "ultimine-${{ steps.version.outputs.version }}-BP.zip"
          asset_name: "ultimine-${{ steps.version.outputs.version }}-BP.zip"
          asset_content_type: application/zip

      - name: Upload RP zip
        if: steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "ultimine-${{ steps.version.outputs.version }}-RP.zip"
          asset_name: "ultimine-${{ steps.version.outputs.version }}-RP.zip"
          asset_content_type: application/zip
